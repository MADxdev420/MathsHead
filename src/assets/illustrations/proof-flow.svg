<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Egy indirekt bizonyítás útja"><rect width="600" height="260" rx="16" fill="#f7faf2"/><text x="300" y="31" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#285943">Egy indirekt bizonyítás útja</text><rect x="30" y="110" width="140" height="48" rx="9" fill="#eaf2e5" stroke="#a5bf9b"/><text x="100" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#285943">Tagadás feltevése</text><line x1="175" y1="134" x2="215" y2="134" stroke="#6c9b7f" stroke-width="2"/><text x="195" y="126" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#285943">→</text><rect x="220" y="110" width="150" height="48" rx="9" fill="#eaf2e5" stroke="#a5bf9b"/><text x="295" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#285943">Következmények</text><line x1="375" y1="134" x2="415" y2="134" stroke="#6c9b7f" stroke-width="2"/><text x="395" y="126" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#285943">→</text><rect x="420" y="110" width="150" height="48" rx="9" fill="#eaf2e5" stroke="#a5bf9b"/><text x="495" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#285943">Ellentmondás</text><text x="300" y="205" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#285943">A kiinduló állítás igaz, ha tagadása ellentmondásra vezet.</text></svg>