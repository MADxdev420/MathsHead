<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="RSA: nyilvános és privát kulcs"><rect width="600" height="260" rx="16" fill="#f7faf2"/><text x="300" y="31" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#285943">RSA: nyilvános és privát kulcs</text><rect x="30" y="115" width="130" height="48" rx="9" fill="#eaf2e5" stroke="#a5bf9b"/><text x="95" y="145" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#285943">Üzenet m</text><text x="205" y="105" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#285943">(n,e)</text><line x1="165" y1="139" x2="245" y2="139" stroke="#6c9b7f" stroke-width="2"/><text x="205" y="134" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#285943">→</text><rect x="250" y="115" width="100" height="48" rx="9" fill="#eaf2e5" stroke="#a5bf9b"/><text x="300" y="145" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#285943">c = mᵉ mod n</text><text x="395" y="105" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#285943">(n,d)</text><line x1="355" y1="139" x2="435" y2="139" stroke="#6c9b7f" stroke-width="2"/><text x="395" y="134" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#285943">→</text><rect x="440" y="115" width="130" height="48" rx="9" fill="#eaf2e5" stroke="#a5bf9b"/><text x="505" y="145" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#285943">m = cᵈ mod n</text><text x="300" y="215" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#285943">A kis prímekkel végzett demonstráció nem biztonságos titkosítás.</text></svg>